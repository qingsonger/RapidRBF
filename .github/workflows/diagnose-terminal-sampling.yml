name: Diagnose terminal process-tree sampling

on:
  workflow_dispatch:
  push:
    branches:
      - codex/diagnose-terminal-sampling-race
    paths:
      - .github/workflows/diagnose-terminal-sampling.yml
      - tools/prototypes/double_double_refinement_witness_throwaway/controller_observer.py
      - tools/prototypes/terminal_sampling_diagnosis_throwaway/**

permissions:
  contents: read

jobs:
  controller-only:
    name: Controller only (${{ matrix.lane_id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane_id: windows-x86_64
            runner: windows-2025
          - lane_id: linux-x86_64-glibc
            runner: ubuntu-24.04
          - lane_id: macos-arm64
            runner: macos-15
          - lane_id: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Configure canonical Git bytes on Windows before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - name: Check out only the diagnostic surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/prototypes/double_double_refinement_witness_throwaway
            tools/prototypes/terminal_sampling_diagnosis_throwaway
      - name: Replay captured Issue 53 traces
        shell: pwsh
        run: |
          python tools/prototypes/terminal_sampling_diagnosis_throwaway/diagnose.py
      - name: Exercise root-bound policy controls
        shell: pwsh
        run: |
          python tools/prototypes/terminal_sampling_diagnosis_throwaway/native_probe.py
      - name: Reproduce exact native inventory phase
        shell: pwsh
        run: |
          python tools/prototypes/terminal_sampling_diagnosis_throwaway/native_inventory_probe.py
