name: Diagnose controller-only preflight failures

on:
  push:
    branches:
      - codex/diagnose-controller-preflight
    paths:
      - .github/workflows/diagnose-controller-preflight.yml
      - tools/prototypes/controller_preflight_diagnosis_throwaway/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-controller-preflight
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnose ${{ matrix.lane_id }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane_id: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            python_command: python
          - lane_id: linux-x86_64-glibc
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python_command: python3
          - lane_id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            python_command: python3
          - lane_id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            python_command: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.85.0"
      RAPIDRBF_LANE_ID: ${{ matrix.lane_id }}
      RAPIDRBF_TARGET: ${{ matrix.target }}
    steps:
      - name: Configure canonical Git bytes on Windows before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install the exact Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Capture and qualify the controller-only lane
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/collect_lane_identity.py
          --contract
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/lane-contract.v1.json
          --lane
          "${{ matrix.lane_id }}"
          --output
          "diagnostic-lane/${{ matrix.lane_id }}"

      - name: Persist every unchanged Issue 51 controller check
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/controller_preflight_diagnosis_throwaway/diagnose.py
          --lane-id
          "${{ matrix.lane_id }}"
          --target
          "${{ matrix.target }}"
          --lane-witness
          "diagnostic-lane/${{ matrix.lane_id }}/lane-identity.json"
          --output
          "diagnostic-evidence/${{ matrix.lane_id }}"

      - name: Upload the immutable diagnostic journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-issue52-controller-diagnostic-${{ matrix.lane_id }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostic-evidence
          if-no-files-found: error
          retention-days: 90

  cohort:
    name: Aggregate controller-only failure detail
    if: always()
    needs: [diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Download this run's controller-only journals
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rapidrbf-issue52-controller-diagnostic-*-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostic-evidence
          merge-multiple: true

      - name: Verify and aggregate the four-lane diagnosis
        run: >-
          python3
          tools/prototypes/controller_preflight_diagnosis_throwaway/summarize.py
          --evidence-root
          diagnostic-evidence
          --output
          diagnostic-cohort

      - name: Upload the immutable diagnostic cohort
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-issue52-controller-diagnostic-cohort-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostic-cohort
          if-no-files-found: error
          retention-days: 90

      - name: Publish the readable diagnosis
        if: always()
        run: cat diagnostic-cohort/diagnostic-cohort.md >> "$GITHUB_STEP_SUMMARY"
