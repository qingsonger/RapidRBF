name: Controller-valid double-double refinement witness gate

on:
  push:
    branches:
      - codex/execute-controller-valid-refinement-witness
    paths:
      - .github/workflows/controller-valid-double-double-refinement-witness.yml
      - tools/prototypes/double_double_refinement_witness_throwaway/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-valid-double-double-refinement-witness
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight ${{ matrix.lane_id }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane_id: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            python_command: python
          - lane_id: linux-x86_64-glibc
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python_command: python3
          - lane_id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            python_command: python3
          - lane_id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            python_command: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.85.0"
      RAPIDRBF_LANE_ID: ${{ matrix.lane_id }}
      RAPIDRBF_TARGET: ${{ matrix.target }}
    steps:
      - name: Configure canonical Git bytes on Windows before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install the exact Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Capture and qualify the zero-entry native host
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/collect_lane_identity.py
          --contract
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/lane-contract.v1.json
          --lane
          "${{ matrix.lane_id }}"
          --output
          "preflight-lane/${{ matrix.lane_id }}"

      - name: Build and execute the zero-factor-call binding preflight
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/double_double_refinement_witness_throwaway/run.py
          --preflight-only
          --lane-id
          "${{ matrix.lane_id }}"
          --target
          "${{ matrix.target }}"
          --lane-witness
          "preflight-lane/${{ matrix.lane_id }}/lane-identity.json"
          --output
          "preflight-evidence/${{ matrix.lane_id }}"

      - name: Upload the immutable preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-controller-valid-refinement-preflight-${{ matrix.lane_id }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: preflight-evidence
          if-no-files-found: error
          retention-days: 90

  reference:
    name: Reuse the accepted candidate-independent reference
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.85.0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install the exact Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Download the frozen issue-41 input
        run: >-
          gh release download
          issue-41-factor-qualification-input-v1
          --repo "${{ github.repository }}"
          --pattern rapidrbf-issue41-factor-qualification-input-v1.zip
          --dir qualification-input

      - name: Materialize the unchanged accepted reference
        run: |
          mkdir reference-evidence
          python3 \
            tools/prototypes/repaired_factor_requalification_throwaway/generate_references.py \
            --bundle \
            qualification-input/rapidrbf-issue41-factor-qualification-input-v1.zip \
            --output \
            reference-evidence/reference-manifest.v1.json

      - name: Upload the exact reference
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-controller-valid-refinement-reference-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: reference-evidence
          if-no-files-found: error
          retention-days: 90

  target:
    name: Execute ${{ matrix.lane_id }}
    needs: [preflight, reference]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane_id: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            python_command: python
          - lane_id: linux-x86_64-glibc
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python_command: python3
          - lane_id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            python_command: python3
          - lane_id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            python_command: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.85.0"
      RAPIDRBF_LANE_ID: ${{ matrix.lane_id }}
      RAPIDRBF_TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure canonical Git bytes on Windows before checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install the exact Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Download all four completed preflights
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rapidrbf-controller-valid-refinement-preflight-*-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: preflight-cohort
          merge-multiple: true

      - name: Download the accepted reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rapidrbf-controller-valid-refinement-reference-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: reference-evidence

      - name: Capture and qualify the native host
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/collect_lane_identity.py
          --contract
          tools/prototypes/instrumented_faer_lane_provisioning_throwaway/lane-contract.v1.json
          --lane
          "${{ matrix.lane_id }}"
          --output
          "target-evidence/${{ matrix.lane_id }}/lane"

      - name: Download the frozen issue-41 input
        run: >-
          gh release download
          issue-41-factor-qualification-input-v1
          --repo "${{ github.repository }}"
          --pattern rapidrbf-issue41-factor-qualification-input-v1.zip
          --dir qualification-input

      - name: Execute all frozen profiles
        run: >-
          ${{ matrix.python_command }}
          tools/prototypes/double_double_refinement_witness_throwaway/run.py
          --bundle
          qualification-input/rapidrbf-issue41-factor-qualification-input-v1.zip
          --lane-id
          "${{ matrix.lane_id }}"
          --target
          "${{ matrix.target }}"
          --lane-witness
          "target-evidence/${{ matrix.lane_id }}/lane/lane-identity.json"
          --reference-manifest
          reference-evidence/reference-manifest.v1.json
          --preflight-root
          preflight-cohort
          --output
          "target-evidence/${{ matrix.lane_id }}/qualification"

      - name: Upload the complete target evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-controller-valid-refinement-target-${{ matrix.lane_id }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target-evidence
          if-no-files-found: error
          retention-days: 90

  cohort:
    name: Judge the non-compensating witness cohort
    if: always()
    needs: [preflight, reference, target]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Download this attempt's target evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rapidrbf-controller-valid-refinement-target-*-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: cohort-evidence
          merge-multiple: true

      - name: Download this attempt's preflight evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rapidrbf-controller-valid-refinement-preflight-*-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: cohort-evidence
          merge-multiple: true

      - name: Download this attempt's accepted reference
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rapidrbf-controller-valid-refinement-reference-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: cohort-evidence/reference-evidence

      - name: Verify and judge the immutable cohort
        run: >-
          python3
          tools/prototypes/double_double_refinement_witness_throwaway/verify_cohort.py
          --contract
          tools/prototypes/double_double_refinement_witness_throwaway/execution-contract.v1.json
          --evidence-root
          cohort-evidence
          --output
          cohort-summary

      - name: Upload the cohort judgment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rapidrbf-controller-valid-refinement-cohort-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: cohort-summary
          if-no-files-found: error
          retention-days: 90

      - name: Publish the readable disposition
        if: always()
        run: cat cohort-summary/cohort-summary.md >> "$GITHUB_STEP_SUMMARY"
