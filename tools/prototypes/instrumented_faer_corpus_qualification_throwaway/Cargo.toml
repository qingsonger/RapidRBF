[package]
name = "rapidrbf-instrumented-faer-corpus-qualification-throwaway"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
dyn-stack = { path = "../instrumented_faer_candidate_binding_throwaway/vendor/dyn-stack-0.13.2", default-features = false, features = ["alloc", "core-error", "std"] }
faer = { path = "../instrumented_faer_candidate_binding_throwaway/vendor/faer-0.24.4", default-features = false, features = ["std", "linalg"] }
rapidrbf-faer-control = { path = "../instrumented_faer_candidate_binding_throwaway/crates/rapidrbf-faer-control" }
rapidrbf-instrumented-factor = { path = "../instrumented_faer_candidate_binding_throwaway/crates/rapidrbf-instrumented-factor" }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[patch.crates-io]
dyn-stack = { path = "../instrumented_faer_candidate_binding_throwaway/vendor/dyn-stack-0.13.2" }
faer = { path = "../instrumented_faer_candidate_binding_throwaway/vendor/faer-0.24.4" }
private-gemm-x86 = { path = "../instrumented_faer_candidate_binding_throwaway/vendor/private-gemm-x86-0.1.20" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
